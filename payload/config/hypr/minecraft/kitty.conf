font_family Monocraft
font_size 15
background #111c22
foreground #e3dfc6
selection_background #396453
selection_foreground #ffffff
cursor #8cce87
cursor_shape block
cursor_blink_interval 0
background_opacity 0.96
window_padding_width 22
hide_window_decorations yes
confirm_os_window_close -1
enable_audio_bell no
color0 #17252c
color1 #d77a66
color2 #8cce87
color3 #dfb46d
color4 #7ca6bf
color5 #a78abe
color6 #68c9b7
color7 #dedaca
color8 #657a7c
color9 #eb9984
color10 #a6e1a1
color11 #f3cb86
color12 #9bc6df
color13 #c3a3d9
color14 #8ce5d2
color15 #fff7dc

# Send one legacy editing sequence per press, including in TUI apps.
map backspace send_text all \x7f
map delete send_text all \x1b[3~
