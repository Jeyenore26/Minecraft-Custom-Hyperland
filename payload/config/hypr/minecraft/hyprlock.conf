# Generated Minecraft landscape with native password entry on the physical sign.
# Composition: 16:9. Sign face center is 79.7% across and 45% down.
general {
 hide_cursor = true
 ignore_empty_input = true
}
animations {
 enabled = false
}
background {
 monitor =
 path = @HOME@/.local/share/minecraft-desktop/lock-sign/golem-village-v2.png
 blur_passes = 0
 brightness = 1.0
 contrast = 1.0
 vibrancy = 0.0
 noise = 0.0
 color = rgb(393d2d)
}
label {
 monitor =
 text = World paused
 color = rgb(30200f)
 font_size = 24
 font_family = Minecraft
 position = 29.7%, 11.7%
 halign = center
 valign = center
 zindex = 2
}
input-field {
 monitor =
 size = 21%, 48
 outline_thickness = 0
 dots_size = 0.20
 dots_spacing = 0.5
 dots_rounding = 0
 outer_color = rgba(00000000)
 inner_color = rgba(00000000)
 font_color = rgb(30200f)
 font_family = Minecraft
 check_color = rgba(00000000)
 fail_color = rgba(00000000)
 fade_on_empty = false
 placeholder_text = <span foreground="black" size="18000">Enter password</span>
 check_text = <span foreground="black" size="18000">Checking...</span>
 fail_text = <span foreground="maroon" size="18000">Try again</span>
 rounding = 0
 position = 29.7%, 5.0%
 halign = center
 valign = center
 zindex = 3
}
label {
 monitor =
 text = Enter to unlock
 color = rgb(30200f)
 font_size = 18
 font_family = Minecraft
 position = 29.7%, -2.0%
 halign = center
 valign = center
 zindex = 2
}
